<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-gray-100">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md transform transition-all duration-300">
    <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8">Welcome Back</h2>
    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg mb-6" role="alert" aria-live="assertive">
      {{ errorMessage }}
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          class="mt-1 block w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 placeholder-gray-400"
          placeholder="Enter your email"
          aria-describedby="email-error"
          required
        >
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          class="mt-1 block w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 placeholder-gray-400"
          placeholder="Enter your password"
          aria-describedby="password-error"
          required
        >
      </div>
      <div class="flex items-center">
        <input
          id="staySignedIn"
          formControlName="staySignedIn"
          type="checkbox"
          class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded transition duration-200"
          aria-label="Stay signed in"
        >
        <label for="staySignedIn" class="ml-2 block text-sm text-gray-700">Stay Signed In</label>
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
        [attr.aria-disabled]="loginForm.invalid ? 'true' : 'false'"
      >
        Login
      </button>
      <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account?
        <a href="/register" class="text-indigo-600 hover:text-indigo-800 hover:underline transition duration-200">Register</a>
      </p>
    </form>
  </div>
</div>
