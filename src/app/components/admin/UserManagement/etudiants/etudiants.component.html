<!-- src/app/components/admin/UserManagement/etudiants/etudiants.component.html -->
<div class="etudiants-management">
  <h2>Étudiant Management</h2>

  <div class="modal-overlay" *ngIf="showForm">
    <div class="modal-content">
      <form #etudiantForm="ngForm" (ngSubmit)="onSubmit(etudiantForm.value)" class="semestre-form">
        <div class="form-header">
          <h3>{{ editMode ? 'Modifier Étudiant' : 'Ajouter un Nouvel Étudiant' }}</h3>
          <button mat-icon-button (click)="cancelForm()" class="close-button">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <mat-form-field appearance="fill">
          <mat-label>Nom</mat-label>
          <input matInput name="nom" [(ngModel)]="selectedEtudiant.nom" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Prénom</mat-label>
          <input matInput name="prenom" [(ngModel)]="selectedEtudiant.prenom" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput name="email" [(ngModel)]="selectedEtudiant.email" required type="email">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput name="password" [(ngModel)]="selectedEtudiant.password" required type="password">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Numéro d'Inscription</mat-label>
          <input matInput name="numeroInscription" [(ngModel)]="selectedEtudiant.numeroInscription" required>
        </mat-form-field>
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="!etudiantForm.valid">
            {{ editMode ? 'Mettre à jour' : 'Ajouter' }}
          </button>
          <button mat-raised-button (click)="cancelForm()">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <button mat-raised-button (click)="openForm()">
    <mat-icon>add</mat-icon> 
  </button>
  <button mat-raised-button color="primary" (click)="openAffectationDialog()" [disabled]="selectedEtudiantIds.length === 0">
    <mat-icon>assignment</mat-icon> Affecter Parcours
  </button>

  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="select">
      <mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="toggleAll($event.checked)" [checked]="isAllSelected()"></mat-checkbox>
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <mat-checkbox (change)="toggleSelection(element.id, $event.checked)" [checked]="selectedEtudiantIds.includes(element.id)"></mat-checkbox>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="nom">
      <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.nom }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="prenom">
      <mat-header-cell *matHeaderCellDef>Prénom</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.prenom }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.email }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="numeroInscription">
      <mat-header-cell *matHeaderCellDef>Numéro d'Inscription</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.numeroInscription }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="editEtudiant(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteEtudiant(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
