<div class="semestres-list">
  <h2>Semestres List</h2>

  <!-- Modal Overlay for Add/Edit Form -->
  <div class="modal-overlay" *ngIf="showForm">
    <div class="modal-content">
      <form #semestreForm="ngForm" (ngSubmit)="onSubmit(semestreForm.value)" class="semestre-form">
        <div class="form-header">
          <h3>{{ editMode ? 'Modifier Semestre' : 'Ajouter un Nouveau Semestre' }}</h3>
          <button mat-icon-button (click)="cancelForm()" class="close-button">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <mat-form-field >
          <mat-label>Name</mat-label>
          <input matInput name="nom" [(ngModel)]="newSemestre.nom" required>
        </mat-form-field>
        <mat-form-field >
          <mat-label>Panier IDs (comma-separated)</mat-label>
          <input matInput name="panierIds" [ngModel]="panierIdsString" (ngModelChange)="updatePanierIds($event)">
        </mat-form-field>
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="!semestreForm.valid">
            {{ editMode ? 'Mettre à jour' : 'Ajouter' }}
          </button>
          <button mat-raised-button (click)="cancelForm()">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add New Semestre Button -->
  <button mat-raised-button (click)="openForm()" style="margin-top: 10px;">
    <mat-icon>add</mat-icon> 
  </button>

  <!-- Semestre Table -->
  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="nom">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.nom }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="editSemestre(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteSemestre(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
