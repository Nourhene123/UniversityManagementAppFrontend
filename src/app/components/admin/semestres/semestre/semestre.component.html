
<div class="modal-overlay" *ngIf="showForm">
  <div class="modal-content">
    <form [formGroup]="semestreForm" (ngSubmit)="onSubmit()" class="semestre-form">
      <div class="form-header">
        <h3>{{ editMode ? 'Modifier Semestre' : 'Ajouter un Nouveau Semestre' }}</h3>
        <button mat-icon-button (click)="cancelForm()" class="close-button">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <mat-form-field appearance="fill">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" required>
        <mat-error *ngIf="semestreForm.get('nom')?.hasError('required')">
          Le nom est requis
        </mat-error>
      </mat-form-field>
      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="semestreForm.invalid || isSubmitting">
          {{ editMode ? 'Mettre à jour' : 'Ajouter' }}
        </button>
        <button mat-raised-button (click)="cancelForm()" [disabled]="isSubmitting">Annuler</button>
      </div>
    </form>
  </div>
</div>

<!-- List and add button displayed only when showAddFormOnly is false -->
<div class="semestres-list" *ngIf="!showAddFormOnly">
  <h2>Liste des semestres</h2>
  <button mat-raised-button (click)="openForm()" style="margin-top: 10px;">
    <mat-icon>add</mat-icon>
  </button>
  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="nom">
      <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.nom }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="editSemestre(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteSemestre(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
