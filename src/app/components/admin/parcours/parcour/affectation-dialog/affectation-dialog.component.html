

<mat-dialog-content class="dialog-content">
  <div *ngIf="isLoading" class="loading">Chargement...</div>

  <ng-container *ngIf="!isLoading">
    <!-- Assign a parcours to students -->
    <ng-container *ngIf="mode === 'assignParcour'; else assignToParcour">
      <mat-form-field appearance="fill" class="full-width select-field">
        <mat-label>Choisir un parcours</mat-label>
        <mat-select [(ngModel)]="selectedParcourId">
          <mat-option *ngFor="let parcour of parcours" [value]="parcour.id">
            {{ parcour.nom }} ({{ parcour.annee }} - {{ parcour.libelle }})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </ng-container>

    <!-- Assign students to a parcours -->
    <ng-template #assignToParcour>
      <mat-selection-list
        class="selection-list"
        [(ngModel)]="selectedEtudiantIds">
        <mat-list-option
          *ngFor="let etudiant of etudiants"
          [value]="etudiant.id"
          class="list-option">
          {{ etudiant.prenom }} {{ etudiant.nom }} ({{ etudiant.email }})
        </mat-list-option>
      </mat-selection-list>
    </ng-template>
  </ng-container>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button class="cancel-button" (click)="cancel()" [disabled]="isLoading">Annuler</button>
  <button
    mat-raised-button
    class="save-button"
    color="primary"
    (click)="save()"
    [disabled]="
      isLoading ||
      (mode === 'assignParcour' && !selectedParcourId) ||
      (mode === 'assignToParcour' && selectedEtudiantIds.length === 0)
    "
  >
    Affecter
  </button>
</mat-dialog-actions>
